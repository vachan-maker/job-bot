candidate:
  name: Alex Doe
  email: alex.doe@example.com
  phone: "+91 9876543210"
  linkedin: linkedin.com/in/alexdoe
  github: github.com/alexdoe
  portfolio: https://alexdoe.dev
  facts: profile/facts.md
  resume_root: ~/Resume

sources:
  infopark:
    enabled: true
    base_url: https://infopark.in
    max_pages: 30
    delay: 1.0
    user_agent: "jobbot/0.1 (personal job search; alex.doe@example.com)"
  technopark:
    enabled: true
    base_url: https://technopark.in
    per_page: 20
    delay: 1.0
    user_agent: "jobbot/0.1 (personal job search; alex.doe@example.com)"

filters:
  locations: [kochi, trivandrum, remote, kerala, unspecified]
  seniority:
    accept: [fresher, junior, trainee, intern, associate, graduate, entry]
    reject: [senior, lead, architect, principal, manager, head]
  max_experience_years: 2
  exclude_categories:
    - sales
    - marketing
    - content
    - accounts
    - recruiter
    - legal
    - insurance
    - casting
    - model
    - support
    - bpo
    - hr
    - human resources
    - talent acquisition
    - business development
    - bde
    - bda
    - bdo
    - graphic
    - designer
    - videographer
    - video
    - vfx
    - animation
    - electrician
    - facility
    - logistics
    - tele caller
    - telecaller
    - telecalling
    - customer care
    - call centre
    - operations
  skip_walk_ins: true
  company_cooldown_days: 30

ranking:
  shortlist_threshold: 70        # Band A (auto-shortlist)
  review_threshold: 55           # Band B (review queue)
  weights:
    skills: 45
    title: 20
    location: 10
    recency: 10
    family: 10
    novel_company: 5

tailoring:
  enabled: true
  max_per_day: 8
  model: opencode                # falls back to gemini-2.5-flash on failure
  tectonic: ~/.local/bin/tectonic
  forbidden_terms:
    - Selenium
    - Cypress
    - STLC
    - JIRA
    - Kubernetes
    - "CI/CD"
    - Terraform
    - TestRail

sending:
  mode: approve                  # approve | auto | off
  daily_cap: 12
  per_run: 6
  min_gap_seconds: 60
  max_gap_seconds: 180
  window: "10:00-17:00"
  weekdays_only: true

followup:
  enabled: false                 # enable after 2 weeks of data
  after_days: 7
  max: 1
